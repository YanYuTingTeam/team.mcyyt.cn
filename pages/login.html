<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login@team / YanYuTing</title>
<link rel="icon" href="/assets/yyt64x.png">
<style>
@font-face {
    font-family: 'Patika';
    src: url('/assets/Patika-Medium.otf') format('opentype');
    font-display: swap;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
#loadMask {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 99;
    display: flex;
    align-items: center;
    justify-content: center;
}
#loadMask svg { width: 40px; height: 40px; color: #ef5777; }
.spin { animation: spin1 .8s linear infinite; }
@keyframes spin1 { to { transform: rotate(360deg); } }
body {
    font-family: 'Patika', 'MiSans', '微软雅黑', sans-serif;
    background: #0a0a0a;
    color: #eee;
    height: 100vh;
    overflow: hidden;
}
.big-box { display: flex; height: 100vh; }
.left-side {
    flex: 1.6;
    position: relative;
    background: linear-gradient(135deg, #1a0d12 0%, #0d0d0f 55%, #16090e 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}
.left-side video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.left-logo-box {
    position: relative;
    z-index: 2;
    text-align: center;
}
.left-logo-box img { width: 340px; max-width: 60vw; filter: drop-shadow(0 6px 30px rgba(0,0,0,.6)); }
.left-slogan {
    margin-top: 18px;
    font-size: 30px;
    letter-spacing: 6px;
    color: #fff;
    text-shadow: 0 2px 16px rgba(0,0,0,.7);
}
.left-slogan .kuo { color: #ef5777; font-weight: bold; }
.left-mask {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.35);
    z-index: 1;
}
.right-side {
    flex: 1;
    min-width: 420px;
    background: #0f0f10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
    overflow-y: auto;
}
.login-box { width: 100%; max-width: 360px; }
.login-title { font-size: 28px; text-align: center; font-weight: bold; }
.login-sub { text-align: center; color: #999; margin: 14px 0 28px; font-size: 16px; }
.tip-box {
    border: 1px solid #4a3a1e;
    background: #1c150a;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    color: #d8b877;
    margin-bottom: 22px;
    line-height: 1.6;
}
.tip-box b { display: block; color: #f0cf8e; margin-bottom: 4px; }
.field-box { margin-bottom: 22px; }
.field-top { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
.field-top label::before { content: '* '; color: #ef5777; }
.field-top a { color: #ef5777; text-decoration: none; font-size: 12px; }
.field-box input {
    width: 100%;
    background: #060607;
    border: 1px solid #2b2b2e;
    border-radius: 8px;
    padding: 13px 14px;
    color: #eee;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border .2s;
}
.field-box input:focus { border-color: #ef5777; }
.field-box input[type=date] { color-scheme: dark; }
.pw-hint { font-size: 12px; color: #a89468; line-height: 1.7; margin-top: 8px; }
.pw-wrap { position: relative; }
.pw-wrap .eye {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: #777;
    font-size: 16px;
    user-select: none;
    display: flex;
    align-items: center;
}
.pw-wrap .eye:hover { color: #ccc; }
.err-msg { color: #ff6b81; font-size: 13px; min-height: 18px; margin-bottom: 8px; }
.login-btn {
    width: 100%;
    background: linear-gradient(90deg, #d9436b, #ef5777);
    border: none;
    border-radius: 8px;
    padding: 13px;
    color: #fff;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    transition: opacity .2s;
}
.login-btn:hover { opacity: .88; }
.login-btn:disabled { opacity: .5; cursor: not-allowed; }
.go-reg {
    margin-top: 18px;
    border: 1px solid rgba(239, 87, 119, .35);
    background: #151517;
    border-radius: 10px;
    padding: 14px;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: border .2s;
}
.go-reg:hover { border-color: #ef5777; }
.go-reg .person { display: flex; align-items: center; font-size: 20px; color: #ddd; flex-shrink: 0; }
.go-reg .txt { flex: 1; min-width: 0; }
.go-reg .t1 { color: #eee; font-weight: bold; font-size: 14px; }
.go-reg .t2 { color: #ef5777; font-size: 12px; margin-top: 3px; }
.go-reg .arrow { color: #666; font-size: 16px; display: flex; align-items: center; }
.xieyi { text-align: center; color: #666; font-size: 12px; margin-top: 18px; line-height: 1.6; }
.lang-tag {
    position: fixed;
    top: 18px;
    right: 22px;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    color: #aaa;
    z-index: 3;
}
.hide { display: none !important; }
/* 验证码弹窗 */
.verify-overlay {
    position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0);
    display: flex; align-items: center; justify-content: center; padding: 20px;
    animation: vFadeIn .22s ease forwards;
}
.verify-overlay.closing { animation: vFadeOut .18s ease forwards; }
@keyframes vFadeIn { to { background: rgba(0,0,0,.7); } }
@keyframes vFadeOut { from { background: rgba(0,0,0,.7); } to { background: rgba(0,0,0,0); } }
.verify-box {
    background: #0f0f10; border: 1px solid #2b2b2e; border-radius: 14px;
    padding: 32px 36px; width: 100%; max-width: 380px;
    animation: vPop .26s cubic-bezier(.2,.8,.2,1) forwards;
}
.verify-overlay.closing .verify-box { animation: vPopOut .18s ease forwards; }
@keyframes vPop { from { opacity:0; transform: translateY(16px) scale(.96); } to { opacity:1; transform: translateY(0) scale(1); } }
@keyframes vPopOut { to { opacity:0; transform: translateY(8px) scale(.97); } }
.verify-title { font-size: 18px; font-weight: bold; text-align: center; color: #eee; }
.verify-sub { font-size: 13px; color: #999; text-align: center; margin: 10px 0 22px; line-height: 1.6; }
.verify-sub b { color: #ef5777; }
.code-row { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; }
.code-row input {
    width: 44px; height: 52px; text-align: center; font-size: 22px; font-weight: bold;
    background: #060607; border: 1px solid #2b2b2e; border-radius: 8px; color: #eee;
    font-family: inherit; outline: none; transition: border .2s;
}
.code-row input:focus { border-color: #ef5777; }
.code-row input.err { border-color: #ff6b81; animation: shake .3s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
.verify-resend { text-align: center; margin-bottom: 16px; }
.verify-resend a { color: #ef5777; text-decoration: none; font-size: 12px; cursor: pointer; }
.verify-resend a.disabled { color: #555; cursor: not-allowed; }
.verify-btn {
    width: 100%; background: linear-gradient(90deg, #d9436b, #ef5777); border: none;
    border-radius: 8px; padding: 12px; color: #fff; font-size: 15px; font-family: inherit; cursor: pointer;
}
.verify-btn:disabled { opacity: .5; cursor: not-allowed; }
.verify-err { color: #ff6b81; font-size: 13px; text-align: center; min-height: 18px; margin-bottom: 10px; }
/* 注册验证码字段 */
.send-code-row { display: flex; gap: 10px; }
.send-code-row input { flex: 1; }
.send-code-btn {
    flex-shrink: 0; background: #151517; border: 1px solid rgba(239,87,119,.35);
    border-radius: 8px; padding: 0 16px; color: #ef5777; font-size: 13px; font-family: inherit;
    cursor: pointer; white-space: nowrap; transition: border .2s;
}
.send-code-btn:hover { border-color: #ef5777; }
.send-code-btn:disabled { opacity: .5; cursor: not-allowed; }
@media (max-width: 900px) {
    .left-side { display: none; }
    .right-side { min-width: 0; }
}
@media (max-width: 600px) {
    body { height: auto; min-height: 100vh; overflow: auto; }
    .big-box { display: block; height: auto; min-height: 100vh; }
    .right-side { padding: 20px 16px; min-height: 100vh; align-items: flex-start; padding-top: 8vh; }
    .login-box { max-width: 100%; }
    .login-title { font-size: 24px; }
    .login-sub { font-size: 14px; margin: 10px 0 20px; }
    .tip-box { font-size: 12px; padding: 10px 12px; margin-bottom: 16px; }
    .field-box { margin-bottom: 16px; }
    .field-box input { padding: 11px 12px; font-size: 13px; }
    .login-btn { padding: 12px; font-size: 14px; }
    .go-reg { padding: 12px; }
}
</style>
</head>
<body>
<div id="loadMask"><svg xmlns="http://www.w3.org/2000/svg" class="spin" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3a9 9 0 1 0 9 9"/></svg></div>
<!-- <div class="lang-tag">简</div> -->
<div class="big-box">
    <div class="left-side">
        <video autoplay muted loop playsinline onerror="this.remove()">
            <source src="https://zhishi.oss-cn-beijing.aliyuncs.com/user_projects_assets/16fc0bf2b72656eb8e9c9bee096c3bcb.mp4" type="video/mp4">
        </video>
        <div class="left-mask"></div>
        <!-- <div class="left-logo-box">
            <img src="https://zhishi.oss-cn-beijing.aliyuncs.com/user_projects_assets/8dc1228e306610e583e5728cd7e49fa7.png" alt="烟雨庭">
            <div class="left-slogan"><span class="kuo">[</span> 创 造 <span class="kuo">]</span></div>
        </div> -->
    </div>
    <div class="right-side">
        <div class="login-box" id="loginBox">
            <div class="login-title">登录 @team</div>
            <div class="login-sub">今天, 此刻, 开始你的团队工作!</div>
            <div class="tip-box">
                <b>烟雨庭 @team</b>
                这里是团队内部空间, 账号需要邀请码注册. 如果你还没有邀请码, 请联系管理员获取.
            </div>
            <div class="field-box">
                <div class="field-top"><label>邮箱</label></div>
                <input type="email" id="loginEmail" placeholder="you@mcyyt.cn">
            </div>
            <div class="field-box">
                <div class="field-top"><label>密码</label><a href="javascript:void(0)" onclick="alert('请联系管理员重置密码')">忘记密码?</a></div>
                <div class="pw-wrap">
                    <input type="password" id="loginPassword" placeholder="请输入密码">
                    <span class="eye" onclick="togglePw('loginPassword', this)"></span>
                </div>
            </div>
            <div class="err-msg" id="loginErr"></div>
            <button class="login-btn" id="loginBtn" onclick="doLogin()">登录</button>
            <div class="go-reg" onclick="showReg(true)">
                <div class="person"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0-8 0M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg></div>
                <div class="txt">
                    <div class="t1">没有Adventure Passport?</div>
                    <div class="t2">使用邀请码注册一个, 即可进入成员空间</div>
                </div>
                <div class="arrow"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m9 6l6 6l-6 6"/></svg></div>
            </div>
            <!-- <div class="xieyi">继续即视为您已同意本站的使用协议及隐私政策</div> -->
        </div>
        <div class="login-box hide" id="regBox">
            <div class="login-title">注册 Adventure Passport</div>
            <div class="login-sub">现在, 是时候, 加入我们了</div>
            <div class="field-box">
                <div class="field-top"><label>邮箱</label></div>
                <input type="email" id="regEmail" placeholder="welcome@mcyyt.cn">
            </div>
            <div class="field-box">
                <div class="field-top"><label>昵称</label></div>
                <input type="text" id="regName" placeholder="我们怎么称呼你">
            </div>
            <div class="field-box">
                <div class="field-top"><label>密码</label></div>
                <div class="pw-wrap">
                    <input type="password" id="regPassword" placeholder="至少 12 位">
                    <span class="eye" onclick="togglePw('regPassword', this)"></span>
                </div>
                <div class="pw-hint">密码要求: 至少 12 位, 并同时包含大写字母、小写字母、数字和符号.</div>
            </div>
            <div class="field-box">
                <div class="field-top"><label>确认密码</label></div>
                <div class="pw-wrap">
                    <input type="password" id="regPassword2" placeholder="再次输入密码">
                    <span class="eye" onclick="togglePw('regPassword2', this)"></span>
                </div>
            </div>
            <div class="field-box">
                <div class="field-top"><label>邀请码</label></div>
                <input type="text" id="regCode" placeholder="填写一次性邀请码">
            </div>
            <div class="field-box">
                <div class="field-top"><label>邮箱验证码</label></div>
                <div class="send-code-row">
                    <input type="text" id="regEmailCode" placeholder="6位验证码" maxlength="6" inputmode="numeric">
                    <button class="send-code-btn" id="sendRegCodeBtn" onclick="sendRegCode()">发送验证码</button>
                </div>
            </div>
            <div class="err-msg" id="regErr"></div>
            <button class="login-btn" id="regBtn" onclick="doReg()">注册</button>
            <div class="go-reg" onclick="showReg(false)">
                <div class="person"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0-8 0M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg></div>
                <div class="txt">
                    <div class="t1">已经拥有 Adventure Passport?</div>
                    <div class="t2">前往登录页面，畅享众多 @team 服务。</div>
                </div>
                <div class="arrow"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m9 6l6 6l-6 6"/></svg></div>
            </div>
        </div>
    </div>
</div>
<div class="verify-overlay hide" id="verifyOverlay">
    <div class="verify-box">
        <div class="verify-title">异地登录验证</div>
        <div class="verify-sub">检测到你在<b>新设备</b>上登录, 已向 <b id="verifyEmail"></b> 发送验证码</div>
        <div class="code-row">
            <input type="text" maxlength="1" inputmode="numeric" id="vc1" oninput="codeNext(this,'vc2')" onkeydown="codeBack(event,this,'vc1')">
            <input type="text" maxlength="1" inputmode="numeric" id="vc2" oninput="codeNext(this,'vc3')" onkeydown="codeBack(event,this,'vc1')">
            <input type="text" maxlength="1" inputmode="numeric" id="vc3" oninput="codeNext(this,'vc4')" onkeydown="codeBack(event,this,'vc2')">
            <input type="text" maxlength="1" inputmode="numeric" id="vc4" oninput="codeNext(this,'vc5')" onkeydown="codeBack(event,this,'vc3')">
            <input type="text" maxlength="1" inputmode="numeric" id="vc5" oninput="codeNext(this,'vc6')" onkeydown="codeBack(event,this,'vc4')">
            <input type="text" maxlength="1" inputmode="numeric" id="vc6" onkeydown="codeBack(event,this,'vc5')">
        </div>
        <div class="verify-err" id="verifyErr"></div>
        <div class="verify-resend"><a id="resendLink" onclick="resendLoginCode()">重新发送验证码</a></div>
        <button class="verify-btn" id="verifyBtn" onclick="submitVerifyCode()">验证并登录</button>
    </div>
</div>
<script>
var EYE_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M10 12a2 2 0 1 0 4 0a2 2 0 0 0-4 0"/><path d="M21 12q-3.6 6-9 6t-9-6q3.6-6 9-6t9 6"/></g></svg>';
var EYE_OFF_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M10.585 10.587a2 2 0 0 0 2.829 2.828"/><path d="M16.681 16.673A8.7 8.7 0 0 1 12 18q-5.4 0-9-6q1.908-3.18 4.32-4.674m2.86-1.146A9 9 0 0 1 12 6q5.4 0 9 6q-1 1.665-2.138 2.87M3 3l18 18"/></g></svg>';
document.querySelectorAll('.eye').forEach(function(el) { el.innerHTML = EYE_SVG; });
function togglePw(id, el) {
    var ipt = document.getElementById(id);
    if (ipt.type === 'password') { ipt.type = 'text'; el.innerHTML = EYE_OFF_SVG; }
    else { ipt.type = 'password'; el.innerHTML = EYE_SVG; }
}
function showReg(flag) {
    document.getElementById('loginBox').classList.toggle('hide', flag);
    document.getElementById('regBox').classList.toggle('hide', !flag);
}
async function postJson(url, body) {
    var res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
    });
    return res.json();
}

/* ===== 登录 ===== */
var loginEmailVal = '', loginPwVal = '';
async function doLogin() {
    var btn = document.getElementById('loginBtn');
    var err = document.getElementById('loginErr');
    err.textContent = '';
    btn.disabled = true;
    loginEmailVal = document.getElementById('loginEmail').value;
    loginPwVal = document.getElementById('loginPassword').value;
    try {
        var ret = await postJson('/api/login', { email: loginEmailVal, password: loginPwVal });
        if (ret.code === 0) { location.reload(); return; }
        if (ret.code === 202) {
            btn.disabled = false;
            openVerifyModal();
            return;
        }
        err.textContent = ret.message || '登录失败';
    } catch (e) {
        err.textContent = '网络出问题了, 稍后再试';
    }
    btn.disabled = false;
}

/* ===== 登录验证码弹窗 ===== */
function openVerifyModal() {
    document.getElementById('verifyEmail').textContent = loginEmailVal;
    document.getElementById('verifyErr').textContent = '';
    for (var i = 1; i <= 6; i++) document.getElementById('vc' + i).value = '';
    var ov = document.getElementById('verifyOverlay');
    ov.classList.remove('hide', 'closing');
    // 自动发送验证码
    sendLoginCode();
    setTimeout(function() { document.getElementById('vc1').focus(); }, 100);
}
function closeVerifyModal() {
    var ov = document.getElementById('verifyOverlay');
    ov.classList.add('closing');
    setTimeout(function() { ov.classList.add('hide'); ov.classList.remove('closing'); }, 180);
}
function codeNext(self, nextId) {
    self.value = self.value.replace(/\D/g, '');
    if (self.value && nextId) document.getElementById(nextId).focus();
}
function codeBack(e, self, prevId) {
    if (e.key === 'Backspace' && !self.value && prevId) {
        document.getElementById(prevId).focus();
    }
}
function getVerifyCode() {
    var c = '';
    for (var i = 1; i <= 6; i++) c += document.getElementById('vc' + i).value;
    return c;
}
var resendTimer = null;
async function sendLoginCode() {
    var link = document.getElementById('resendLink');
    link.classList.add('disabled');
    link.textContent = '发送中...';
    var ret = await postJson('/api/send_email_code', { email: loginEmailVal, purpose: 'login' });
    if (ret.code === 0) {
        var cnt = 120;
        link.textContent = '重新发送 (' + cnt + 's)';
        resendTimer = setInterval(function() {
            cnt--;
            if (cnt <= 0) {
                clearInterval(resendTimer);
                link.classList.remove('disabled');
                link.textContent = '重新发送验证码';
            } else {
                link.textContent = '重新发送 (' + cnt + 's)';
            }
        }, 1000);
    } else {
        link.classList.remove('disabled');
        link.textContent = '重新发送验证码';
        document.getElementById('verifyErr').textContent = ret.message || '发送失败';
    }
}
function resendLoginCode() {
    var link = document.getElementById('resendLink');
    if (link.classList.contains('disabled')) return;
    sendLoginCode();
}
async function submitVerifyCode() {
    var code = getVerifyCode();
    var errEl = document.getElementById('verifyErr');
    errEl.textContent = '';
    if (code.length !== 6) {
        errEl.textContent = '请输入完整的6位验证码';
        return;
    }
    var btn = document.getElementById('verifyBtn');
    btn.disabled = true;
    try {
        var ret = await postJson('/api/login', { email: loginEmailVal, password: loginPwVal, email_code: code });
        if (ret.code === 0) { location.reload(); return; }
        errEl.textContent = ret.message || '验证失败';
        if (ret.code === 403) {
            for (var i = 1; i <= 6; i++) {
                var el = document.getElementById('vc' + i);
                el.classList.add('err');
                (function(el) { setTimeout(function() { el.classList.remove('err'); }, 400); })(el);
            }
        }
    } catch (e) {
        errEl.textContent = '网络出问题了';
    }
    btn.disabled = false;
}

/* ===== 注册 ===== */
function checkPwStrong(pw) {
    return pw.length >= 12 && /[A-Z]/.test(pw) && /[a-z]/.test(pw) && /\d/.test(pw) && /[^A-Za-z0-9]/.test(pw);
}
var regSendTimer = null;
async function sendRegCode() {
    var btn = document.getElementById('sendRegCodeBtn');
    var email = document.getElementById('regEmail').value.trim();
    if (!email) { document.getElementById('regErr').textContent = '请先填写邮箱'; return; }
    btn.disabled = true;
    btn.textContent = '发送中...';
    var ret = await postJson('/api/send_email_code', { email: email, purpose: 'register' });
    if (ret.code === 0) {
        var cnt = 120;
        btn.textContent = '重新发送 (' + cnt + 's)';
        regSendTimer = setInterval(function() {
            cnt--;
            if (cnt <= 0) {
                clearInterval(regSendTimer);
                btn.disabled = false;
                btn.textContent = '发送验证码';
            } else {
                btn.textContent = '重新发送 (' + cnt + 's)';
            }
        }, 1000);
    } else {
        btn.disabled = false;
        btn.textContent = '发送验证码';
        document.getElementById('regErr').textContent = ret.message || '发送失败';
    }
}
async function doReg() {
    var btn = document.getElementById('regBtn');
    var err = document.getElementById('regErr');
    err.textContent = '';
    var pw = document.getElementById('regPassword').value;
    var pw2 = document.getElementById('regPassword2').value;
    if (!checkPwStrong(pw)) { err.textContent = '密码不符合要求'; return; }
    if (pw !== pw2) { err.textContent = '两次输入的密码不一致'; return; }
    var emailCode = document.getElementById('regEmailCode').value.trim();
    if (!emailCode || emailCode.length !== 6) { err.textContent = '请填写6位邮箱验证码'; return; }
    btn.disabled = true;
    try {
        var ret = await postJson('/api/register', {
            name: document.getElementById('regName').value,
            email: document.getElementById('regEmail').value,
            password: pw,
            invite_code: document.getElementById('regCode').value,
            email_code: emailCode
        });
        if (ret.code === 0) { location.reload(); return; }
        err.textContent = ret.message || '注册失败';
    } catch (e) {
        err.textContent = '网络出问题了, 稍后再试';
    }
    btn.disabled = false;
}
document.addEventListener('keydown', function(e) {
    if (e.key !== 'Enter') return;
    if (!document.getElementById('verifyOverlay').classList.contains('hide')) {
        if (e.target.id && e.target.id.startsWith('vc')) submitVerifyCode();
        return;
    }
    if (document.getElementById('regBox').classList.contains('hide')) doLogin();
    else doReg();
});
function hideMask() {
    document.getElementById('loadMask').style.display = 'none';
}
window.addEventListener('load', function() {
    document.fonts.ready.then(hideMask);
});
setTimeout(hideMask, 4000);
</script>
