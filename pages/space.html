<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@team / YanYuTing</title>
<link rel="icon" href="/assets/yyt64x.png">
<link rel="stylesheet" href="/assets/app.css?_v=2">
<script>
(function(){
    function err(msg){
        var el = document.getElementById('__bs');
        if(el){
            el.innerHTML = '<div style="color:#ef5777;font-size:13px;line-height:1.8;text-align:center">'
                +msg+'<br><a style="color:#bbb;text-decoration:underline;cursor:pointer" onclick="location.reload()">点此重试</a></div>';
        }
    }
    function afterHtml(){
        var bs = document.getElementById('__bs');
        if(bs){ bs.style.display='none'; }
        var s = document.createElement('script');
        s.src = '/assets/app.js?_v=' + Date.now();
        s.onerror = function(){ err('应用脚本加载失败, 请刷新重试.'); };
        document.head.appendChild(s);
    }
    function go(){
        var htmlR = fetch('/assets/space_ui.html?_v=' + Date.now(), {cache:'no-store'});
        htmlR.then(function(r){
            if(r.status === 401){ location.href = '/login.html'; return Promise.reject(new Error('unauth')); }
            if(!r.ok) throw new Error('UI '+r.status);
            return r.text();
        }).then(function(html){
            document.body.insertAdjacentHTML('beforeend', html);
            afterHtml();
        })['catch'](function(e){
            if(e && /unauth/.test(e.message)) return;
            setTimeout(function(){ location.href = '/login.html'; }, 800);
        });
    }
    if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', go); } else { go(); }
})();
</script>
<style>
.__boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:9999;
  background:
    radial-gradient(ellipse at 20% 10%, rgba(99,102,241,.10), transparent 55%),
    radial-gradient(ellipse at 85% 0%, rgba(139,92,246,.10), transparent 55%),
    radial-gradient(ellipse at 50% 100%, rgba(239,87,119,.06), transparent 60%),
    linear-gradient(180deg, #07080c 0%, #0a0a0f 50%, #08080a 100%);
}
.__boot .__lg{font-family:Orbixbeta,sans-serif;font-size:24px;letter-spacing:4px;color:#c7c8cc;animation:__pf 1.4s ease-in-out infinite;}
.__boot .__sp{color:#555;font-size:12px;letter-spacing:2px;}
.__boot .__bar{width:260px;height:2px;background:#151518;border-radius:2px;overflow:hidden;margin-top:4px;}
.__boot .__bar::after{content:"";display:block;width:40%;height:100%;background:linear-gradient(90deg,#ef5777,#8b5cf6);border-radius:2px;animation:__bs 1.3s ease-in-out infinite;}
@keyframes __pf{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes __bs{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
</style>
</head>
<body>
<div class="__boot" id="__bs">
    <div class="__lg">@team / YanYuTing</div>
    <div class="__bar"></div>
    <div class="__sp">@team / LOADING ...</div>
</div>
</body>
</html>
