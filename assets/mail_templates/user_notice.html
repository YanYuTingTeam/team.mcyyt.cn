<!DOCTYPE html>
<html><head><meta charset="UTF-8"></head>
<body style="margin:0;padding:0;background:#0a0a0a;font-family:'MiSans','微软雅黑',sans-serif">
<table width="100%" cellpadding="0" cellspacing="0" style="background:linear-gradient(135deg,#1a0d1a 0%,#0d0d0f 55%,#0d1a1a 100%);min-height:100vh">
<tr><td align="center" style="padding:40px 20px">
<table width="460" cellpadding="0" cellspacing="0" style="background:#0f0f10;border:1px solid #2b2b2e;border-radius:14px;overflow:hidden">
<tr><td style="padding:28px 32px 0">
<div style="font-size:20px;font-weight:bold;color:#eee;letter-spacing:1px">@team / YanYuTing</div>
<div style="font-size:13px;color:#ef5777;margin-top:4px">通知动态 · UPDATES</div>
</td></tr>
<tr><td style="padding:20px 32px">
<div style="height:1px;background:#2b2b2e;margin-bottom:20px"></div>
<p style="font-size:14px;color:#ccc;line-height:1.8;margin:0 0 14px 0">
{{USER_NAME}} 你好, 你有一条新的通知动态:
</p>
<div style="background:#0d0d0f;border:1px solid #2a2a2e;border-radius:10px;padding:16px 18px">
<div style="color:#eee;font-size:16px;font-weight:bold;line-height:1.6;margin-bottom:8px">{{NOTICE_TITLE}}</div>
<div style="font-size:12px;color:#888;margin-bottom:12px">{{NOTICE_CREATED_AT}}</div>
{% if NOTICE_CONTENT %}
<div style="font-size:14px;color:#bbb;line-height:1.7">{{NOTICE_CONTENT}}</div>
{% endif %}
</div>
<div style="margin-top:22px;text-align:center">
<a href="{{BASE_URL}}/space" target="_blank" style="display:inline-block;padding:10px 28px;background:linear-gradient(115deg,#ef5777,#f59f00);color:#fff;text-decoration:none;border-radius:8px;font-size:14px;font-weight:bold">前往空间查看 →</a>
</div>
<p style="font-size:12px;color:#666;line-height:1.7;margin:22px 0 0 0">
如果你不希望再收到此类通知, 可在 <strong style="color:#999">设置 → 通知</strong> 中关闭对应开关.
</p>
</td></tr>
<tr><td style="padding:0 32px 20px">
<div style="height:1px;background:#2b2b2e;margin-bottom:16px"></div>
<p style="font-size:11px;color:#555;margin:0">
@team / YanYuTing — 烟雨庭团队协作空间<br>
此邮件由系统自动发送, 请勿回复
</p>
</td></tr>
</table>
</td></tr>
</table>
</body></html>
